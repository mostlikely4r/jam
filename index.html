<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      body { font: 13px/1.4 ui-monospace, Consolas, monospace; color: #cfd8e6; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 14px; top: 12px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #help { position: fixed; left: 14px; bottom: 12px; color: #7f8ba0; pointer-events: none; }
      #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 290px; padding: 12px 14px; box-sizing: border-box;
               background: #0b0f18e8; border-left: 1px solid #222a3a; overflow-y: auto; }
      #panel[hidden] { display: none; }
      #panel h2 { font-size: 12px; margin: 14px 0 6px; color: #8fb4ff; text-transform: uppercase; letter-spacing: 1px; }
      #panel h2:first-child { margin-top: 0; }
      #panel label { display: block; margin-bottom: 7px; }
      #panel .row { display: flex; justify-content: space-between; }
      #panel .value { color: #ffd479; }
      #panel input[type="range"] { width: 100%; margin: 1px 0 0; accent-color: #8fb4ff; }
      #panel button { background: #1a2233; color: #cfd8e6; border: 1px solid #33405a; padding: 5px 8px; margin: 10px 6px 0 0;
                      font: inherit; cursor: pointer; }
      #panel button:hover { background: #26324a; }
      #panel button.retro { display: block; width: 100%; margin: 0 0 12px; }
      #panel button.retro.on { background: #2f5a34; border-color: #5fae66; }
      #panel label.toggle { margin-bottom: 3px; cursor: pointer; }
      #panel p { margin: 0 0 6px; color: #7f8ba0; }
      #shop { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); width: 560px; padding: 10px 12px;
              background: #0b0f18e8; border: 1px solid #5fae66; }
      #shop[hidden] { display: none; }
      #shop h2 { font-size: 12px; margin: 0 0 8px; color: #8fe3a1; text-transform: uppercase; letter-spacing: 1px; }
      #shop button { display: block; width: 100%; text-align: left; background: #1a2233; color: #cfd8e6; border: 1px solid #33405a;
                     padding: 4px 8px; margin-top: 4px; font: inherit; cursor: pointer; }
      #shop button:hover:enabled { background: #26324a; }
      #shop button:disabled { color: #6a7486; cursor: default; }
      #shop button.owned { border-color: #5fae66; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="help">W/S thrust  A/D strafe  Q/E or arrows rotate  X retro  1-9, 0 dock shop  Space fire  Click move there, right click cancel (needs the part)  Wheel zoom  R restart  Tab tuning  P pause  M mute</div>
    <div id="shop" hidden></div>
    <div id="panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
