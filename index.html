<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JAM - Just another asteroid miner</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      body { font: 13px/1.4 ui-monospace, Consolas, monospace; color: #cfd8e6; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 14px; top: 12px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #hud[hidden] { display: none; }
      #pause, #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #05070dcc; }
      #pause[hidden], #start[hidden] { display: none; }
      #pause .box, #start .box { width: 560px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 22px 26px; box-sizing: border-box;
                    background: #0b0f18f2; border: 1px solid #33405a; }
      #start .box { width: 820px; }
      #pause h1, #start h1 { margin: 0; font-size: 28px; letter-spacing: 6px; color: #8fb4ff; }
      #pause .sub, #start .sub { margin: 2px 0 18px; color: #7f8ba0; }
      #start .cards { display: flex; gap: 16px; }
      #start .card { flex: 1; border: 1px solid #33405a; background: #0d1320; padding: 10px; cursor: pointer; }
      #start .card:hover { border-color: #8fb4ff; }
      #start .card canvas { position: static; width: 100%; height: 220px; display: block; background: #05070d; }
      #start .card h2 { font-size: 15px; margin: 10px 0 4px; color: #8fe3a1; letter-spacing: 1px; }
      #start .card p { margin: 0 0 8px; color: #aab6c8; }
      #start .card button { width: 100%; background: #14261b; color: #8fe3a1; border: 1px solid #5fae66; padding: 7px 10px;
                            font: inherit; cursor: pointer; }
      #start .hint { margin: 14px 0 0; color: #7f8ba0; }
      #pause h2 { font-size: 12px; margin: 16px 0 6px; color: #8fe3a1; text-transform: uppercase; letter-spacing: 1px; }
      #pause button { display: block; width: 100%; text-align: left; background: #1a2233; color: #cfd8e6; border: 1px solid #33405a;
                      padding: 7px 10px; margin-top: 6px; font: inherit; cursor: pointer; }
      #pause button:hover { background: #26324a; }
      #pause button.back { margin-top: 18px; }
      #pause button.danger { color: #e88a8a; border-color: #a84f4f; }
      #pause table { border-collapse: collapse; width: 100%; }
      #pause td { padding: 2px 0; vertical-align: top; }
      #pause td:first-child { color: #ffd479; width: 42%; padding-right: 10px; }
      #pause p { margin: 0 0 8px; color: #aab6c8; }
      #pause label { display: block; margin: 10px 0 4px; }
      #pause input[type="range"] { width: 100%; accent-color: #8fb4ff; }
      #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 290px; padding: 12px 14px; box-sizing: border-box;
               background: #0b0f18e8; border-left: 1px solid #222a3a; overflow-y: auto; }
      #panel[hidden] { display: none; }
      #panel h2 { font-size: 12px; margin: 14px 0 6px; color: #8fb4ff; text-transform: uppercase; letter-spacing: 1px; }
      #panel h2:first-child { margin-top: 0; }
      #panel h2.group { cursor: pointer; user-select: none; }
      #panel h2.group::before { content: "▾  "; }
      #panel h2.group.closed::before { content: "▸  "; }
      #panel h2.group:hover { color: #b9cfff; }
      #panel label { display: block; margin-bottom: 7px; }
      #panel .row { display: flex; justify-content: space-between; }
      #panel .value { color: #ffd479; }
      #panel input[type="range"] { width: 100%; margin: 1px 0 0; accent-color: #8fb4ff; }
      #panel button { background: #1a2233; color: #cfd8e6; border: 1px solid #33405a; padding: 5px 8px; margin: 10px 6px 0 0;
                      font: inherit; cursor: pointer; }
      #panel button:hover { background: #26324a; }
      #panel button.retro { display: block; width: 100%; margin: 0 0 12px; }
      #panel button.retro.on { background: #2f5a34; border-color: #5fae66; }
      #panel label.toggle { margin-bottom: 3px; cursor: pointer; }
      #panel p { margin: 0 0 6px; color: #7f8ba0; }
      #shop { position: fixed; right: 12px; bottom: 44px; width: 430px; max-height: calc(100vh - 64px); overflow-y: auto;
              box-sizing: border-box; padding: 10px 12px; background: #0b0f18e8; border: 1px solid #5fae66; }
      #shop[hidden] { display: none; }
      #chatter { position: fixed; right: 12px; top: 12px; width: 380px; pointer-events: none; font-size: 13px;
                 text-shadow: 0 1px 2px #000; }
      body:has(#panel:not([hidden])) #chatter { right: 302px; }
      #chatter div { margin-bottom: 3px; transition: opacity 1s; }
      #chatter .who { color: #a8d8ff; }
      #chatter .station .who { color: #8fe3a1; }
      #chatter .mayday { color: #ff8a7c; }
      #chatter .mayday .who { color: #ff6b5c; }
      body:has(#panel:not([hidden])) #shop { right: 302px; }
      #shop h2 { font-size: 12px; margin: 0 0 8px; color: #8fe3a1; text-transform: uppercase; letter-spacing: 1px; }
      #shop button { display: block; width: 100%; text-align: left; background: #1a2233; color: #cfd8e6; border: 1px solid #33405a;
                     padding: 4px 8px; margin-top: 4px; font: inherit; cursor: pointer; }
      #shop button:hover:enabled { background: #26324a; }
      #shop button:disabled { color: #6a7486; cursor: default; }
      #shop button.buy { color: #8fe3a1; border-color: #5fae66; background: #14261b; }
      #shop button.sell { color: #7fdfe6; border-color: #46b4bd; background: #122529; }
      #shop button.unlock { color: #f0d86a; border-color: #cdb342; background: #29240f; }
      #shop button.partial { color: #f0a868; border-color: #c97f3c; background: #2b1d10; }
      #shop button.pending { color: #c4a4f0; border-color: #8f6fc9; background: #211a30; }
      #shop button.poor { color: #e88a8a; border-color: #a84f4f; background: #2a1616; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden></div>
    <div id="chatter"></div>
    <div id="shop" hidden></div>
    <div id="panel" hidden></div>
    <div id="pause" hidden><div class="box"></div></div>
    <div id="start" hidden><div class="box"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
