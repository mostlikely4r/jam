<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JAM - Just another asteroid miner</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      body { font: 13px/1.4 ui-monospace, Consolas, monospace; color: #cfd8e6; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 14px; top: 12px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #hud[hidden] { display: none; }
      #pause, #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #05070dcc; }
      #pause[hidden], #start[hidden] { display: none; }
      #pause .box, #start .box { width: 560px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 22px 26px; box-sizing: border-box;
                    background: #0b0f18f2; border: 1px solid #33405a; }
      #start .box { width: 820px; }
      #pause h1, #start h1 { margin: 0; font-size: 28px; letter-spacing: 6px; color: #8fb4ff; }
      #pause .sub, #start .sub { margin: 2px 0 18px; color: #7f8ba0; }
      #start .cards { display: flex; gap: 16px; }
      #start .card { flex: 1; border: 1px solid #33405a; background: #0d1320; padding: 10px; cursor: pointer; }
      #start .card:hover { border-color: #8fb4ff; }
      #start .card canvas { position: static; width: 100%; height: 220px; display: block; background: #05070d; }
      #start .card h2 { font-size: 15px; margin: 10px 0 4px; color: #8fe3a1; letter-spacing: 1px; }
      #start .card p { margin: 0 0 8px; color: #aab6c8; }
      #start .card button { width: 100%; background: #14261b; color: #8fe3a1; border: 1px solid #5fae66; padding: 7px 10px;
                            font: inherit; cursor: pointer; }
      #start .hint { margin: 14px 0 0; color: #7f8ba0; }
      #start .notice { margin: 0 0 14px; padding: 8px 10px; color: #f0d86a; border: 1px solid #cdb342; background: #29240f; }
      #start button.resume { display: block; width: 100%; text-align: left; background: #14261b; color: #8fe3a1; border: 1px solid #5fae66;
                             padding: 8px 10px; margin: 0 0 8px; font: inherit; cursor: pointer; }
      #start button.resume:disabled { background: #1a2233; color: #6a7486; border-color: #33405a; cursor: default; }
      #pause button:disabled { color: #6a7486; cursor: default; }
      #pause h2 { font-size: 12px; margin: 16px 0 6px; color: #8fe3a1; text-transform: uppercase; letter-spacing: 1px; }
      #pause button { display: block; width: 100%; text-align: left; background: #1a2233; color: #cfd8e6; border: 1px solid #33405a;
                      padding: 7px 10px; margin-top: 6px; font: inherit; cursor: pointer; }
      #pause button:hover { background: #26324a; }
      #pause button.back { margin-top: 18px; }
      #pause button.danger { color: #e88a8a; border-color: #a84f4f; }
      #pause table { border-collapse: collapse; width: 100%; }
      #pause td { padding: 2px 0; vertical-align: top; }
      #pause td:first-child { color: #ffd479; width: 42%; padding-right: 10px; }
      #pause p { margin: 0 0 8px; color: #aab6c8; }
      #pause label { display: block; margin: 10px 0 4px; }
      #pause input[type="range"] { width: 100%; accent-color: #8fb4ff; }
      #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 290px; padding: 12px 14px; box-sizing: border-box;
               background: #0b0f18e8; border-left: 1px solid #222a3a; overflow-y: auto; }
      #panel[hidden] { display: none; }
      #panel h2 { font-size: 12px; margin: 14px 0 6px; color: #8fb4ff; text-transform: uppercase; letter-spacing: 1px; }
      #panel h2:first-child { margin-top: 0; }
      #panel h2.group { cursor: pointer; user-select: none; }
      #panel h2.group::before { content: "▾  "; }
      #panel h2.group.closed::before { content: "▸  "; }
      #panel h2.group:hover { color: #b9cfff; }
      #panel label { display: block; margin-bottom: 7px; }
      #panel .row { display: flex; justify-content: space-between; }
      #panel .value { color: #ffd479; }
      #panel input[type="range"] { width: 100%; margin: 1px 0 0; accent-color: #8fb4ff; }
      #panel button { background: #1a2233; color: #cfd8e6; border: 1px solid #33405a; padding: 5px 8px; margin: 10px 6px 0 0;
                      font: inherit; cursor: pointer; }
      #panel button:hover { background: #26324a; }
      #panel button.retro { display: block; width: 100%; margin: 0 0 12px; }
      #panel button.retro.on { background: #2f5a34; border-color: #5fae66; }
      #panel label.toggle { margin-bottom: 3px; cursor: pointer; }
      #panel p { margin: 0 0 6px; color: #7f8ba0; }
      #shop { position: fixed; right: 12px; bottom: 44px; width: 430px; max-height: calc(100vh - 64px); overflow-y: auto;
              box-sizing: border-box; padding: 10px 12px; background: #0b0f18e8; border: 1px solid #5fae66; }
      #shop[hidden] { display: none; }
      #chatter { position: fixed; right: 12px; top: 12px; width: 380px; pointer-events: none; font-size: 13px;
                 text-shadow: 0 1px 2px #000; }
      body:has(#panel:not([hidden])) #chatter { right: 302px; }
      #chatter div { margin-bottom: 3px; transition: opacity 1s; display: flex; align-items: center; gap: 5px; }
      #chatter svg.face { flex: none; }
      #chatter .who { color: #a8d8ff; }
      #chatter .station .who { color: #8fe3a1; }
      #chatter .mayday { color: #ff8a7c; }
      #chatter .mayday .who { color: #ff6b5c; }
      #chatter button.follow { pointer-events: auto; flex: none; background: #1a2233; color: #a8d8ff; border: 1px solid #33405a;
                               padding: 0 6px; font: inherit; font-size: 11px; cursor: pointer; }
      #chatter button.follow:hover { background: #26324a; }
      body:has(#panel:not([hidden])) #shop { right: 302px; }
      #shop h2.news { margin-top: 12px; }
      #shop p.news { margin: 0 0 4px; font-size: 12px; color: #b8c3d4; }
      #shop h2 { font-size: 12px; margin: 0 0 8px; color: #8fe3a1; text-transform: uppercase; letter-spacing: 1px; }
      #shop button { display: block; width: 100%; text-align: left; background: #1a2233; color: #cfd8e6; border: 1px solid #33405a;
                     padding: 4px 8px; margin-top: 4px; font: inherit; cursor: pointer; }
      #shop button:hover:enabled { background: #26324a; }
      #shop button:disabled { color: #6a7486; cursor: default; }
      #shop button.buy { color: #8fe3a1; border-color: #5fae66; background: #14261b; }
      #shop button.sell { color: #7fdfe6; border-color: #46b4bd; background: #122529; }
      #shop button.unlock { color: #f0d86a; border-color: #cdb342; background: #29240f; }
      #shop button.partial { color: #f0a868; border-color: #c97f3c; background: #2b1d10; }
      #shop button.pending { color: #c4a4f0; border-color: #8f6fc9; background: #211a30; }
      #shop button.poor { color: #e88a8a; border-color: #a84f4f; background: #2a1616; }
      #shop button.small { display: inline-block; width: auto; margin: 0 0 6px; font-size: 12px; }
      #shop .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; }
      #shop .shop-grid h2 { grid-column: 1 / -1; margin: 10px 0 0; }
      #shop .shop-grid h2:first-child { margin-top: 0; }
      #shop button.shop-cell { position: relative; display: flex; align-items: center; justify-content: center;
                               width: 100%; aspect-ratio: 1; padding: 0; margin: 0; text-align: center; }
      #shop button.shop-cell:hover { background: #26324a; }
      #shop button.shop-cell.dim { opacity: 0.38; cursor: default; }
      #shop button.shop-cell.dim:hover { background: #1a2233; }
      #shop .shop-badge { position: absolute; top: -5px; right: -5px; min-width: 13px; height: 13px; padding: 0 2px;
                          box-sizing: border-box; display: flex; align-items: center; justify-content: center;
                          background: #0b0f18; border: 1px solid #33405a; border-radius: 7px; font-size: 9px; line-height: 1; }
      #shop .shop-badge.badge-sell { color: #f0d86a; border-color: #cdb342; }
      #shop .shop-badge.badge-load, #shop .shop-badge.badge-run { color: #8fe3a1; border-color: #5fae66; }
      #shop .shop-badge.badge-lock, #shop .shop-badge.badge-halfLock { border-color: #cdb342; }
      #shop .shop-badge.badge-clock { border-color: #8f6fc9; }
      #shop .shop-badge.badge-tick { border-color: #5fae66; }
      #inventory { position: fixed; left: 12px; bottom: 44px; max-width: calc(100vw - 24px); max-height: calc(100vh - 64px); overflow: auto;
                   box-sizing: border-box; padding: 10px 12px; background: #0b0f18e8; border: 1px solid #46b4bd; font-size: 13px; }
      #inventory[hidden] { display: none; }
      #inventory h2 { font-size: 12px; margin: 10px 0 6px; color: #7fdfe6; text-transform: uppercase; letter-spacing: 1px; }
      #inventory h2:first-child { margin-top: 0; }
      #inventory p { margin: 0 0 4px; color: #b8c3d4; }
      #inventory .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; color: #cfd8e6; }
      #inventory .row span { flex: 1; }
      #inventory button { background: #1a2233; color: #cfd8e6; border: 1px solid #33405a; padding: 1px 6px; font: inherit; font-size: 12px; cursor: pointer; }
      #inventory button:hover { background: #26324a; }
      #inventory .status { min-height: 18px; margin: 0 0 8px; color: #b8c3d4; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #inventory .status span { margin-right: 4px; color: #cfd8e6; }
      #inventory .status.refused { color: #e88a8a; }
      #inventory .columns { display: flex; gap: 18px; align-items: flex-start; }
      #inventory .column { flex: none; max-width: 260px; }
      #inventory .blueprint { position: relative; width: 240px; height: 240px; background: #0d1626;
                              background-image: linear-gradient(#1b2a44 1px, transparent 1px), linear-gradient(90deg, #1b2a44 1px, transparent 1px);
                              background-size: 20px 20px; border: 1px solid #2a3d5e; }
      #inventory .blueprint canvas, #inventory .blueprint svg { position: absolute; left: 0; top: 0; pointer-events: none; }
      #inventory .blueprint line { stroke: #46b4bd; stroke-width: 1; opacity: 0.6; }
      #inventory .port { position: absolute; transform: translate(-50%, -50%); min-width: 22px; padding: 1px 4px; font-size: 11px; text-align: center;
                         background: #122529; color: #7fdfe6; border: 1px solid #46b4bd; cursor: pointer; white-space: nowrap; user-select: none;
                         display: flex; align-items: center; justify-content: center; }
      #inventory .port.empty { background: #0b0f18; color: #5a6a80; border-style: dashed; cursor: default; }
      #inventory .port.damaged, #inventory .item.damaged, #inventory .slot.damaged { color: #f0a868; border-color: #c97f3c; }
      #inventory .port.destroyed, #inventory .item.destroyed { color: #8a6a6a; border-color: #5a3a3a; background: #1a1010; text-decoration: line-through; }
      #inventory .port.selected, #inventory .item.selected { outline: 2px solid #f0d86a; }
      #inventory .port.legal { background: #14261b; color: #8fe3a1; border-color: #8fe3a1; box-shadow: 0 0 6px #5fae66; }
      #inventory .port.dim { opacity: 0.35; }
      #inventory .port.lifted { opacity: 0.6; }
      #inventory .grid { position: relative; background-color: #0d1626; border: 1px solid #2a3d5e;
                         background-image: linear-gradient(#1b2a44 1px, transparent 1px), linear-gradient(90deg, #1b2a44 1px, transparent 1px);
                         background-size: 24px 24px; }
      #inventory .grid > div { position: absolute; box-sizing: border-box; }
      #inventory .grid .pocket { background: repeating-linear-gradient(45deg, #1a2233, #1a2233 3px, #0d1626 3px, #0d1626 6px); }
      #inventory .grid .entry { border: 2px solid #f0d86a; background: #29240f80; }
      #inventory .grid .ore { background: #6b5a1c; border: 1px solid #f0d86a; cursor: pointer; }
      #inventory .grid canvas.lumps { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
      #inventory .grid .item { background: #1d3442; color: #cfe8ee; border: 1px solid #46b4bd; font-size: 10px; padding: 2px; overflow: hidden;
                               cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; }
      #inventory .grid .preview { pointer-events: none; z-index: 2; }
      #inventory .grid .preview.ok { background: #5fae6655; border: 2px solid #8fe3a1; }
      #inventory .grid .preview.bad { background: #a84f4f55; border: 2px solid #e88a8a; }
      #inventory .slots, #inventory .software { display: flex; gap: 4px; flex-wrap: wrap; min-height: 26px; margin-bottom: 6px; }
      #inventory .slot, #inventory .chip { min-width: 44px; padding: 3px 6px; font-size: 11px; text-align: center; border: 1px solid #46b4bd;
                                            background: #122529; color: #7fdfe6; cursor: pointer; user-select: none;
                                            display: inline-flex; align-items: center; justify-content: center; }
      #inventory .slot.empty { border-style: dashed; background: #0b0f18; cursor: default; }
      #inventory .chip { border-color: #33405a; background: #1a2233; color: #cfd8e6; }
      body.dragging #shop { outline: 2px dashed #46b4bd; }
      #dockhint { position: fixed; right: 12px; bottom: 44px; padding: 4px 10px; background: #0b0f18e8; border: 1px solid #5fae66;
                  color: #8fe3a1; font-size: 13px; pointer-events: none; }
      body:has(#panel:not([hidden])) #dockhint { right: 302px; }
      #dockhint[hidden] { display: none; }
      #shop p.refused { margin: 0 0 6px; color: #e88a8a; }
      #shop p.ask { margin: 0 0 6px; white-space: pre-line; color: #dfe6f2; }
      #shop button.ore { display: block; width: 100%; text-align: left; background: none; border: 0; margin: 0; padding: 0 0 4px;
                         font: inherit; font-size: 12px; color: #d8a860; cursor: pointer; }
      #shop button.ore:hover { color: #f0c88a; background: none; text-decoration: underline; }
      #chartmenu { position: fixed; z-index: 41; min-width: 140px; padding: 4px; background: #0b0f18f2; border: 1px solid #33405a; }
      #chartmenu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 8px;
                          font: inherit; font-size: 12px; color: #cfd8e6; cursor: pointer; }
      #chartmenu button:hover { background: #26324a; }
      #tweakmenu { position: fixed; z-index: 41; min-width: 180px; padding: 6px 8px; background: #0b0f18f2; border: 1px solid #33405a; }
      #tweakmenu b { display: block; margin-bottom: 6px; color: #8fe3a1; font-size: 12px; }
      #tweakmenu span { display: block; color: #7f8ba0; font-size: 11px; }
      #tweakmenu .tweak { margin-bottom: 4px; }
      #tweakmenu button { background: #1a2233; color: #cfd8e6; border: 1px solid #33405a; padding: 2px 7px;
                          margin: 3px 3px 0 0; font: inherit; font-size: 11px; cursor: pointer; }
      #tweakmenu button:hover { background: #26324a; }
      #tweakmenu button.on { border-color: #8fe3a1; color: #8fe3a1; }
      .drag-ghost { position: fixed; z-index: 10; pointer-events: none; padding: 3px 8px; background: #14261b; color: #8fe3a1;
                    border: 1px solid #5fae66; font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
      .part-icon { position: relative; display: inline-flex; box-sizing: border-box; border: 1.5px solid; background: #0d1626;
                   border-radius: 3px; line-height: 0; }
      .part-icon canvas { position: static; inset: auto; width: 100%; height: 100%; display: block; }
      .part-icon svg { width: 100%; height: 100%; }
      .part-icon .part-icon-mark { position: absolute; right: 0; bottom: 0; line-height: 1; padding: 0 1px; color: #eef4ff;
                                   background: #05070dcc; border-radius: 2px; font-weight: bold; }
      .part-icon.bare { border: none; background: none; }
      .tooltip { position: fixed; z-index: 60; pointer-events: none; max-width: 300px; padding: 6px 9px;
                 background: #0b0f18f2; border: 1px solid #33405a; font-size: 12px; line-height: 1.45; color: #cfd8e6; }
      .tooltip[hidden] { display: none; }
      .tooltip b { display: block; color: #8fe3a1; }
      .tooltip.warn b { color: #ff6b5c; }
      .tooltip span { display: block; white-space: pre-line; }
      body.dragging { cursor: grabbing; user-select: none; }
      body.dragging [data-drop]:hover { outline: 1px solid #8fe3a1; background: #14261b; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden></div>
    <div id="chatter"></div>
    <div id="shop" hidden></div>
    <div id="inventory" hidden></div>
    <div id="dockhint" hidden>B: shop</div>
    <div id="panel" hidden></div>
    <div id="pause" hidden><div class="box"></div></div>
    <div id="start" hidden><div class="box"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
